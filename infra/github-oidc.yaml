AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC release role for one existing Refund Tracker demo instance
Parameters:
  ArtifactBucket:
    Type: String
    AllowedPattern: '[a-z0-9.-]{3,63}'
  InstanceId:
    Type: String
    AllowedPattern: 'i-[a-f0-9]+'
  ExistingProviderArn:
    Type: String
    Default: ''
Conditions:
  CreateProvider: !Equals [!Ref ExistingProviderArn, '']
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref Provider, !Ref ExistingProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:chohaeminn/aws-team3:environment:aws-demo
      Policies:
        - PolicyName: ReleaseToOneInstance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/releases/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:ListCommandInvocations
                Resource: '*'
Outputs:
  RoleArn:
    Value: !GetAtt ReleaseRole.Arn
