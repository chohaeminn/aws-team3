name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Functional, signature, access, concurrency and rollback tests
        run: npm test > tests.tap 2>&1
      - name: Deployment script syntax
        run: |
          bash -n infra/install.sh
          bash -n scripts/release-aws.sh
          git diff --check
      - name: Measure access boundary enforcement
        if: matrix.node == '24'
        run: npm run benchmark:access
      - name: Validate CloudFormation
        if: matrix.node == '24'
        run: |
          python -m pip install cfn-lint==1.61.0
          cfn-lint infra/demo.yaml infra/github-oidc.yaml
      - name: Package verified source and build
        if: matrix.node == '24'
        run: |
          mkdir -p .deploy
          tar -czf .deploy/refund-tracker.tgz src dist/web package.json package-lock.json infra/install.sh scripts/assign-demo-owner.ts scripts/migrate-sqlite-owners.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-node-${{ matrix.node }}
          path: tests.tap
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.node == '24'
        with:
          name: validated-release-${{ github.sha }}
          path: .deploy/refund-tracker.tgz
          retention-days: 7
