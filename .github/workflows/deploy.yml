name: Deploy AWS demo
on:
  workflow_dispatch:
    inputs:
      target_account:
        description: Confirm the paid AWS demo account
        required: true
        default: '727847798739'
        type: string
permissions:
  contents: read
concurrency:
  group: aws-demo-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.target_account == '727847798739'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      DEMO_INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
      DEMO_ARTIFACT_BUCKET: ${{ vars.DEMO_ARTIFACT_BUCKET }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-${{ github.sha }}
          path: .deploy
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '727847798739'
          role-session-name: github-demo-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy the CI artifact and verify health
        run: bash scripts/release-aws.sh .deploy/refund-tracker.tgz
      - name: Record deployed revision
        run: |
          echo '### Demo release' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Installed with SSM; authenticated browser and actual Bedrock checks remain manual.' >> "$GITHUB_STEP_SUMMARY"
